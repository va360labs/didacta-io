# ============================================================================
# docker-compose.prod.yml — stack de PRODUCCIÓN para aula.va360.academy
# ----------------------------------------------------------------------------
# Stack AUTOCONTENIDO y AISLADO de dev: Postgres + Redis dedicados (no comparte
# datos con didacta-dev). La app corre desde la imagen de producción construida
# con el `Dockerfile` multi-stage (NO Dockerfile.dev: aquí no hay bind-mounts
# ni watch; arranca desde dist/).
#
# Vive en el servidor en /opt/didacta-prod. Routing + TLS los da el mismo
# Traefik (coolify-proxy) vía la red externa `coolify`, igual que dev.
#
# ARRANQUE (ver runbook en Notion):
#   1. Copia infra/docker/.env.prod.example → .env y rellena los secrets.
#   2. docker build -f Dockerfile -t didactaio/community:prod .
#   3. docker compose -f docker-compose.prod.yml up -d
#   4. Seed del tenant: docker compose -f docker-compose.prod.yml run --rm app seed
#      (con BOOTSTRAP_* en .env → crea tenant + dominio aula.va360.academy + super_admin)
#
# El A record aula.va360.academy → 135.181.150.202 debe existir ANTES de que
# Traefik pueda emitir el certificado Let's Encrypt.
# ============================================================================

name: didacta-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      didacta_prod:
        # Alias ÚNICO: el hostname genérico `postgres` colisiona con otro
        # contenedor en la red compartida `coolify` (resolución ambigua → P1000).
        aliases:
          - didacta-prod-pg

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_prod:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      didacta_prod:
        aliases:
          - didacta-prod-redis

  app:
    image: didactaio/community:prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DIDACTA_CORE_VERSION: ${DIDACTA_CORE_VERSION:-0.0.1-alpha.88}
      # BD/Redis dedicados de prod. Hostnames con alias ÚNICO (no `postgres`/`redis`
      # genéricos) para evitar colisión de DNS en la red compartida `coolify`.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@didacta-prod-pg:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://didacta-prod-redis:6379
      API_PORT: '4000'
      WEB_PORT: '3000'
      # URLs públicas (las usan emails de bienvenida/decisión y enlaces absolutos).
      WEB_PUBLIC_URL: https://aula.va360.academy
      API_URL: https://aula.va360.academy
      # Storage local en el volumen persistente (uploads, certificados, evidencias).
      STORAGE_DRIVER: local
      STORAGE_ROOT: /app/data/storage
      # Next.js necesita el host externo para los enlaces.
      NEXT_PUBLIC_DEV_HOST: aula.va360.academy
    volumes:
      - didacta_prod_data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '5', 'http://localhost:4000/healthz']
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'
    networks:
      - didacta_prod
      - coolify
    labels:
      - 'traefik.enable=true'
      # El contenedor está en 2 redes (didacta_prod + coolify). Forzamos que
      # Traefik use la IP de la red `coolify` (donde está el proxy).
      - 'traefik.docker.network=coolify'
      # Middlewares con nombres ÚNICOS de prod (no colisionar con los de dev).
      - 'traefik.http.middlewares.gzip-prod.compress=true'
      - 'traefik.http.middlewares.redirect-to-https-prod.redirectscheme.scheme=https'
      # HTTP → redirige a HTTPS
      - 'traefik.http.routers.http-prod-aula.entryPoints=http'
      - 'traefik.http.routers.http-prod-aula.middlewares=redirect-to-https-prod'
      - 'traefik.http.routers.http-prod-aula.rule=Host(`aula.va360.academy`) && PathPrefix(`/`)'
      - 'traefik.http.routers.http-prod-aula.service=http-prod-aula'
      # HTTPS con TLS (Let's Encrypt)
      - 'traefik.http.routers.https-prod-aula.entryPoints=https'
      - 'traefik.http.routers.https-prod-aula.middlewares=gzip-prod'
      - 'traefik.http.routers.https-prod-aula.rule=Host(`aula.va360.academy`) && PathPrefix(`/`)'
      - 'traefik.http.routers.https-prod-aula.service=https-prod-aula'
      - 'traefik.http.routers.https-prod-aula.tls=true'
      - 'traefik.http.routers.https-prod-aula.tls.certresolver=letsencrypt'
      # La web (Next.js) escucha en :3000 dentro del contenedor.
      - 'traefik.http.services.http-prod-aula.loadbalancer.server.port=3000'
      - 'traefik.http.services.https-prod-aula.loadbalancer.server.port=3000'

volumes:
  pgdata_prod:
  redis_prod:
  didacta_prod_data:

networks:
  didacta_prod:
    driver: bridge
  coolify:
    external: true
