# docker-compose.dev.yml — stack de DESARROLLO para dev.didacta.io
# ============================================================================
# La imagen didactaio/community-dev:latest tiene todas las deps instaladas
# y los packages compilados. Los src/ de api y web se montan en tiempo real
# desde el directorio donde vive este compose en el servidor.
#
# ARRANQUE INICIAL (una vez):
#   docker build -f Dockerfile.dev -t didactaio/community-dev:latest .
#   docker compose -f docker-compose.dev.yml up -d
#
# DEPLOY CALIENTE desde tu máquina (segundos):
#   pnpm dev:push          ← rsync src/ al servidor
#   # API auto-reinicia (~10s), Web actualiza el browser al instante (HMR)
#
# REBUILD DE IMAGEN (solo cuando cambian deps o packages):
#   docker compose -f docker-compose.dev.yml build --no-cache
#   docker compose -f docker-compose.dev.yml up -d
# ============================================================================

name: didacta-dev

services:
  app:
    image: didactaio/community-dev:latest
    restart: unless-stopped

    # Los bind mounts inyectan el código fuente vivo en el contenedor.
    # node_modules y packages/dist/ vienen de la imagen (no se sobreescriben).
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/web/src:/repo/apps/web/src
      - ./apps/web/public:/repo/apps/web/public
      # Paquetes compartidos (descomenta si cambias packages/ con frecuencia)
      # - ./packages:/repo/packages-live
      # Volumen persistente para storage de módulos (igual que producción)
      - didacta_dev_data:/app/data

    ports:
      - '4000:4000'
      - '3010:3010'

    env_file: .env

    environment:
      NODE_ENV: development
      WEB_PORT: '3010'
      # Next.js necesita saber el host externo para HMR via WebSocket
      NEXT_PUBLIC_DEV_HOST: '${NEXT_PUBLIC_DEV_HOST:-dev.didacta.io}'

    healthcheck:
      test: ['CMD', 'curl', '-fsS', '--max-time', '5', 'http://localhost:4000/healthz']
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5

    # Logging compacto en dev
    logging:
      driver: json-file
      options:
        max-size: '50m'
        max-file: '3'

    networks:
      - didacta_dev
      - coolify

    labels:
      - 'traefik.enable=true'
      # El contenedor está en 2 redes (didacta_dev + coolify). Sin esta pista,
      # el provider Docker de Traefik puede resolver la IP de la red privada
      # didacta_dev (a la que el coolify-proxy NO está conectado) → 504 Gateway
      # Timeout. Forzamos que Traefik use la IP de la red `coolify`.
      - 'traefik.docker.network=coolify'
      - 'traefik.http.middlewares.gzip.compress=true'
      - 'traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https'
      # HTTP → redirige a HTTPS
      - 'traefik.http.routers.http-0-didacta-dev.entryPoints=http'
      - 'traefik.http.routers.http-0-didacta-dev.middlewares=redirect-to-https'
      - 'traefik.http.routers.http-0-didacta-dev.rule=Host(`dev.didacta.io`) && PathPrefix(`/`)'
      - 'traefik.http.routers.http-0-didacta-dev.service=http-0-didacta-dev'
      # HTTPS con TLS
      - 'traefik.http.routers.https-0-didacta-dev.entryPoints=https'
      - 'traefik.http.routers.https-0-didacta-dev.middlewares=gzip'
      - 'traefik.http.routers.https-0-didacta-dev.rule=Host(`dev.didacta.io`) && PathPrefix(`/`)'
      - 'traefik.http.routers.https-0-didacta-dev.service=https-0-didacta-dev'
      - 'traefik.http.routers.https-0-didacta-dev.tls=true'
      - 'traefik.http.routers.https-0-didacta-dev.tls.certresolver=letsencrypt'
      # Puertos: web en 3010, api en 4000
      - 'traefik.http.services.http-0-didacta-dev.loadbalancer.server.port=3010'
      - 'traefik.http.services.https-0-didacta-dev.loadbalancer.server.port=3010'

volumes:
  didacta_dev_data:

networks:
  didacta_dev:
    driver: bridge
  coolify:
    external: true
