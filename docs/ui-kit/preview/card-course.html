<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #F8FAFC; }
  body { font-family: 'Inter'; color: #1F2A3A; padding: 22px; }
  .card { background: #fff; border: 1px solid #D7DEE8; border-radius: 16px; padding: 22px; box-shadow: 0 1px 3px rgba(13,27,42,.06), 0 1px 2px rgba(13,27,42,.04); display: flex; flex-direction: column; gap: 14px; max-width: 360px; }
  .badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #E8F1FB; color: #1E5AA8; align-self: flex-start; text-transform: uppercase; letter-spacing: .06em; }
  .title { font-family: 'Sora'; font-weight: 700; font-size: 22px; line-height: 1.2; color: #0D1B2A; }
  .meta { font-size: 13px; color: #64748B; }
  .progress { height: 8px; background: #F1F3F5; border-radius: 999px; overflow: hidden; }
  .bar { height: 100%; background: #18B5A8; border-radius: 999px; width: 68%; }
  .footer { display: flex; align-items: center; justify-content: space-between; }
  .pct { font-size: 13px; font-weight: 600; color: #0F8077; }
  button { font-family: 'Inter'; font-weight: 600; font-size: 14px; padding: 10px 16px; border-radius: 10px; border: 0; background: #1E5AA8; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <span class="badge">Curso destacado</span>
  <div class="title">Liderazgo transformador</div>
  <div class="meta">12 módulos · Intermedio · 6h</div>
  <div class="progress"><div class="bar"></div></div>
  <div class="footer">
    <div class="pct">68% completado</div>
    <button>Continuar</button>
  </div>
</div>
</body>
</html>
