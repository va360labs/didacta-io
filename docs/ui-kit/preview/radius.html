<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: var(--didacta-font-body); color: var(--didacta-ink-700); padding: 20px 24px; }
  .row { display: flex; gap: 16px; align-items: flex-end; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 80px; height: 56px; background: #fff; border: 1px solid #D7DEE8; }
  .num { font-size: 12px; color: var(--didacta-ink-500); font-family: 'Inter'; }
  .name { font-size: 11px; color: var(--didacta-ink-400); text-transform: uppercase; letter-spacing: .06em; }
  .label { font-size: 12px; color: var(--didacta-ink-400); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="label">Border radius</div>
<div class="row">
  <div class="tile"><div class="box" style="border-radius:6px;"></div><div class="name">SM</div><div class="num">6px</div></div>
  <div class="tile"><div class="box" style="border-radius:8px;"></div><div class="name">MD</div><div class="num">8px</div></div>
  <div class="tile"><div class="box" style="border-radius:12px;"></div><div class="name">LG</div><div class="num">12px</div></div>
  <div class="tile"><div class="box" style="border-radius:20px;"></div><div class="name">XL</div><div class="num">20px</div></div>
  <div class="tile"><div class="box" style="border-radius:999px;"></div><div class="name">Pill</div><div class="num">999px</div></div>
</div>
</body>
</html>
