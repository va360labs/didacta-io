<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: 'Inter'; padding: 22px; color: #1F2A3A; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .nav { background: #fff; border: 1px solid #D7DEE8; border-radius: 12px; padding: 8px; display: flex; gap: 4px; }
  .tab { padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 500; color: #475569; cursor: pointer; }
  .tab.active { background: #E8F1FB; color: #1E5AA8; font-weight: 600; }
  .seg { display: inline-flex; padding: 4px; background: #F1F3F5; border-radius: 10px; gap: 2px; }
  .seg button { font-family: 'Inter'; font-weight: 500; font-size: 13px; padding: 8px 14px; border-radius: 7px; border: 0; background: transparent; color: #475569; cursor: pointer; }
  .seg button.active { background: #fff; color: #0D1B2A; font-weight: 600; box-shadow: 0 1px 2px rgba(13,27,42,.06); }
</style>
</head>
<body>
<div class="row">
  <div class="nav">
    <div class="tab active">Resumen</div>
    <div class="tab">Módulos</div>
    <div class="tab">Comunidad</div>
    <div class="tab">Recursos</div>
  </div>
  <div style="display:flex; align-items:center;">
    <div class="seg">
      <button class="active">Esta semana</button>
      <button>Mes</button>
      <button>Año</button>
    </div>
  </div>
</div>
</body>
</html>
