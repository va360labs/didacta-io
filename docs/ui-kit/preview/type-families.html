<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: var(--didacta-font-body); color: var(--didacta-ink-700); padding: 20px 24px; }
  .row { display: flex; gap: 24px; align-items: center; }
  .families { flex: 1; }
  .name { font-size: 11px; color: var(--didacta-ink-400); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .sora { font-family: 'Sora'; font-weight: 800; font-size: 40px; line-height: 1; color: #0D1B2A; letter-spacing: -.02em; }
  .sora .light { font-weight: 400; color: #475569; }
  .inter { font-family: 'Inter'; font-weight: 600; font-size: 28px; line-height: 1.1; color: #0D1B2A; }
  .inter .light { font-weight: 400; color: #475569; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
</style>
</head>
<body>
<div class="row">
  <div class="families stack">
    <div>
      <div class="name">Display · Sora</div>
      <div class="sora">Aa <span class="light">Didacta</span></div>
    </div>
    <div>
      <div class="name">UI &amp; body · Inter</div>
      <div class="inter">Aa <span class="light">aprendizaje abierto 0123</span></div>
    </div>
  </div>
</div>
</body>
</html>
