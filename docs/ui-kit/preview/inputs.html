<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #F8FAFC; }
  body { font-family: 'Inter'; color: var(--didacta-ink-700); padding: 24px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  label { font-size: 13px; font-weight: 500; color: #1F2A3A; }
  .input { padding: 10px 14px; border-radius: 10px; border: 1px solid #D7DEE8; background: #fff; font-size: 14px; min-height: 40px; box-sizing: border-box; }
  .input.focus { border-color: #1E5AA8; box-shadow: 0 0 0 3px rgba(30,90,168,.25); outline: none; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .help { font-size: 12px; color: #64748B; }
  .err  { font-size: 12px; color: #DC2626; }
</style>
</head>
<body>
<div class="row">
  <div class="field">
    <label>Correo electrónico</label>
    <input class="input" type="email" value="ana@didacta.io" />
    <div class="help">Usaremos este correo para tus certificados.</div>
  </div>
  <div class="field">
    <label>Contraseña</label>
    <input class="input focus" type="password" value="••••••••" />
    <div class="err">Debe contener al menos 8 caracteres.</div>
  </div>
</div>
</body>
</html>
