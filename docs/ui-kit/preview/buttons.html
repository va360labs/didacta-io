<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: var(--didacta-font-body); color: var(--didacta-ink-700); padding: 22px 24px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  button { font-family: 'Inter'; font-weight: 600; font-size: 14px; padding: 10px 18px; border-radius: 10px; border: 1px solid transparent; cursor: pointer; min-height: 40px; transition: all .15s ease-out; }
  .primary { background: #1E5AA8; color: #fff; }
  .primary:hover { background: #184c8e; }
  .secondary { background: #fff; color: #0D1B2A; border-color: #D7DEE8; }
  .secondary:hover { background: #F1F3F5; }
  .success { background: #18B5A8; color: #fff; }
  .alert { background: #FF6F61; color: #fff; }
  .ghost { background: transparent; color: #1E5AA8; }
  .ghost:hover { background: #E8F1FB; }
  .disabled { background: #F1F3F5; color: #94A3B8; border-color: #E2E8F0; cursor: not-allowed; }
  .label { font-size: 12px; color: var(--didacta-ink-400); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="label">Buttons</div>
<div class="row">
  <button class="primary">Continuar</button>
  <button class="secondary">Ver detalles</button>
  <button class="success">Completar</button>
  <button class="alert">Revisar</button>
  <button class="ghost">Más información</button>
  <button class="disabled" disabled>Deshabilitado</button>
</div>
</body>
</html>
