<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: 'Inter'; color: #1F2A3A; padding: 22px 24px; }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; align-items: center; gap: 14px; }
  .pct { width: 50px; font-size: 12px; color: #475569; font-family: 'Inter'; font-weight: 500; }
  .track { flex: 1; height: 8px; background: #F1F3F5; border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; }
  .label { font-size: 12px; color: var(--didacta-ink-400); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
  .name { width: 200px; font-size: 13px; color: #1F2A3A; font-weight: 500; }
</style>
</head>
<body>
<div class="label">Progress · learning</div>
<div class="stack">
  <div class="row"><div class="name">Liderazgo transformador</div><div class="track"><div class="fill" style="width:68%; background:#18B5A8;"></div></div><div class="pct">68%</div></div>
  <div class="row"><div class="name">Comunicación efectiva</div><div class="track"><div class="fill" style="width:100%; background:#18B5A8;"></div></div><div class="pct">100%</div></div>
  <div class="row"><div class="name">Analítica de aprendizaje</div><div class="track"><div class="fill" style="width:32%; background:#1E5AA8;"></div></div><div class="pct">32%</div></div>
  <div class="row"><div class="name">RGPD para formadores</div><div class="track"><div class="fill" style="width:12%; background:#FF6F61;"></div></div><div class="pct">12%</div></div>
</div>
</body>
</html>
