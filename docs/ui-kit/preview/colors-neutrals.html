<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: var(--didacta-font-body); color: var(--didacta-ink-700); }
  .card { box-sizing: border-box; padding: 20px 24px; }
  .row { display: flex; gap: 12px; }
  .swatch { flex: 1; border-radius: 12px; padding: 14px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--didacta-border); }
  .swatch .name { font-family: var(--didacta-font-display); font-weight: 700; font-size: 14px; }
  .swatch .hex  { font-size: 12px; opacity: .85; }
  .label { font-size: 12px; color: var(--didacta-ink-400); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Surfaces &amp; neutrals</div>
  <div class="row">
    <div class="swatch" style="background:#FFFFFF; color:#0D1B2A;">
      <div class="name">Blanco</div><div class="hex">#FFFFFF</div>
    </div>
    <div class="swatch" style="background:#F8FAFC; color:#0D1B2A;">
      <div class="name">Bg suave</div><div class="hex">#F8FAFC</div>
    </div>
    <div class="swatch" style="background:#F1F3F5; color:#0D1B2A;">
      <div class="name">Gris claro</div><div class="hex">#F1F3F5</div>
    </div>
    <div class="swatch" style="background:#E2E8F0; color:#0D1B2A;">
      <div class="name">Border soft</div><div class="hex">#E2E8F0</div>
    </div>
    <div class="swatch" style="background:#D7DEE8; color:#0D1B2A;">
      <div class="name">Border</div><div class="hex">#D7DEE8</div>
    </div>
    <div class="swatch" style="background:#94A3B8; color:#fff;">
      <div class="name">Ink 300</div><div class="hex">#94A3B8</div>
    </div>
    <div class="swatch" style="background:#475569; color:#fff;">
      <div class="name">Ink 500</div><div class="hex">#475569</div>
    </div>
  </div>
</div>
</body>
</html>
