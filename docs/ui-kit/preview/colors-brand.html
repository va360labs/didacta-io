<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: var(--didacta-font-body); color: var(--didacta-ink-700); }
  .card { box-sizing: border-box; padding: 20px 24px; }
  .row { display: flex; gap: 12px; align-items: stretch; }
  .swatch { flex: 1; border-radius: 12px; padding: 14px 14px 12px; min-height: 92px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid var(--didacta-border); }
  .swatch .name { font-family: var(--didacta-font-display); font-weight: 700; font-size: 14px; line-height: 1.2; }
  .swatch .hex  { font-family: 'Inter', sans-serif; font-size: 12px; opacity: .85; letter-spacing: .02em; }
  .label { font-family: var(--didacta-font-body); font-size: 12px; color: var(--didacta-ink-400); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="label">Brand colors</div>
  <div class="row">
    <div class="swatch" style="background:#0D1B2A; color:#fff; border-color:#0D1B2A;">
      <div class="name">Azul noche</div><div class="hex">#0D1B2A</div>
    </div>
    <div class="swatch" style="background:#1E5AA8; color:#fff; border-color:#1E5AA8;">
      <div class="name">Azul confianza</div><div class="hex">#1E5AA8</div>
    </div>
    <div class="swatch" style="background:#2E7DCE; color:#fff; border-color:#2E7DCE;">
      <div class="name">Azul equilibrio</div><div class="hex">#2E7DCE</div>
    </div>
    <div class="swatch" style="background:#18B5A8; color:#fff; border-color:#18B5A8;">
      <div class="name">Verde crecimiento</div><div class="hex">#18B5A8</div>
    </div>
    <div class="swatch" style="background:#FF6F61; color:#fff; border-color:#FF6F61;">
      <div class="name">Coral energía</div><div class="hex">#FF6F61</div>
    </div>
  </div>
</div>
</body>
</html>
