<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #F8FAFC; }
  body { font-family: var(--didacta-font-body); color: var(--didacta-ink-700); padding: 24px; }
  .row { display: flex; gap: 18px; align-items: flex-end; justify-content: space-around; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box { width: 110px; height: 70px; background: #fff; border-radius: 12px; border: 1px solid #E2E8F0; }
  .name { font-size: 11px; color: var(--didacta-ink-400); text-transform: uppercase; letter-spacing: .06em; }
  .num { font-size: 11px; color: var(--didacta-ink-500); font-family: 'Inter'; line-height: 1.4; text-align: center; }
</style>
</head>
<body>
<div class="row">
  <div class="tile">
    <div class="box" style="box-shadow: 0 1px 2px rgba(13,27,42,.04);"></div>
    <div class="name">XS</div>
  </div>
  <div class="tile">
    <div class="box" style="box-shadow: 0 1px 3px rgba(13,27,42,.06), 0 1px 2px rgba(13,27,42,.04);"></div>
    <div class="name">SM · cards</div>
  </div>
  <div class="tile">
    <div class="box" style="box-shadow: 0 4px 12px rgba(13,27,42,.06), 0 2px 4px rgba(13,27,42,.04);"></div>
    <div class="name">MD · hover</div>
  </div>
  <div class="tile">
    <div class="box" style="box-shadow: 0 12px 32px rgba(13,27,42,.08), 0 4px 8px rgba(13,27,42,.04);"></div>
    <div class="name">LG · modal</div>
  </div>
  <div class="tile">
    <div class="box" style="box-shadow: 0 0 0 3px rgba(30,90,168,.25);"></div>
    <div class="name">Focus ring</div>
  </div>
</div>
</body>
</html>
