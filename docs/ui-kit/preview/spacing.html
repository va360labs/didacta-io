<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: var(--didacta-font-body); color: var(--didacta-ink-700); padding: 20px 24px; }
  .row { display: flex; gap: 12px; align-items: flex-end; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { background: #1E5AA8; border-radius: 6px; }
  .num { font-size: 12px; color: var(--didacta-ink-500); font-family: 'Inter'; }
  .label { font-size: 12px; color: var(--didacta-ink-400); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="label">Spacing scale · 4px base</div>
<div class="row">
  <div class="tile"><div class="box" style="width:4px; height:4px;"></div><div class="num">4</div></div>
  <div class="tile"><div class="box" style="width:8px; height:8px;"></div><div class="num">8</div></div>
  <div class="tile"><div class="box" style="width:12px; height:12px;"></div><div class="num">12</div></div>
  <div class="tile"><div class="box" style="width:16px; height:16px;"></div><div class="num">16</div></div>
  <div class="tile"><div class="box" style="width:20px; height:20px;"></div><div class="num">20</div></div>
  <div class="tile"><div class="box" style="width:24px; height:24px;"></div><div class="num">24</div></div>
  <div class="tile"><div class="box" style="width:32px; height:32px;"></div><div class="num">32</div></div>
  <div class="tile"><div class="box" style="width:40px; height:40px;"></div><div class="num">40</div></div>
  <div class="tile"><div class="box" style="width:48px; height:48px;"></div><div class="num">48</div></div>
  <div class="tile"><div class="box" style="width:64px; height:64px;"></div><div class="num">64</div></div>
</div>
</body>
</html>
