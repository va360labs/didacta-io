<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: var(--didacta-font-body); color: var(--didacta-ink-700); }
  .card { box-sizing: border-box; padding: 20px 24px; }
  .grid { display: grid; grid-template-columns: 90px 1fr; row-gap: 14px; column-gap: 20px; align-items: baseline; }
  .meta { font-size: 11px; color: var(--didacta-ink-400); text-transform: uppercase; letter-spacing: .06em; }
  .specimen { color: var(--didacta-night); }
</style>
</head>
<body>
<div class="card">
  <div class="grid">
    <div class="meta">H1 · 48/56</div>
    <div class="specimen" style="font-family:'Sora'; font-weight:800; font-size:36px; line-height:1.15; letter-spacing:-.02em;">Aprende sin límites.</div>

    <div class="meta">H2 · 36/44</div>
    <div class="specimen" style="font-family:'Sora'; font-weight:700; font-size:28px; line-height:1.2; letter-spacing:-.015em;">Rutas formativas a tu ritmo</div>

    <div class="meta">H3 · 28/36</div>
    <div class="specimen" style="font-family:'Sora'; font-weight:600; font-size:22px; line-height:1.25;">Continúa donde lo dejaste</div>
  </div>
</div>
</body>
</html>
