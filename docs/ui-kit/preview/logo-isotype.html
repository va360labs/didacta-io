<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Inter'; padding: 0; display: grid; grid-template-columns: 1fr 1fr; min-height: 280px; }
  .pane { display: grid; place-items: center; padding: 24px; }
  .light { background: #F1F3F5; }
  .dark  { background: #0D1B2A; }
  img { display: block; }
</style>
</head>
<body>
<div class="pane light"><img src="../assets/anagrama.png" style="height:120px; width:auto; border-radius: 22px;" /></div>
<div class="pane dark"><img src="../assets/anagrama.png" style="height:120px; width:auto; border-radius: 22px;" /></div>
</body>
</html>
