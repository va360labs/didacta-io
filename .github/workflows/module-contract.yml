name: Module Contract

# Lint del contrato de módulo Didacta. Bloquea PRs que rompan las 10 reglas
# auto-detectables (ver didacta-skills/scripts/README.md).
#
# Pasado a workflow_dispatch only (2026-05-01): el job depende del checkout de
# va360labs/didacta-skills, que requiere `DIDACTA_SKILLS_PAT` con scope `repo`
# (privado). Sin PAT vigente, el checkout falla con "Not Found" y bloquea el
# merge. Se ejecuta manualmente cuando el PAT esté configurado, o en local con
# `node scripts/audit-modules.mjs --json` (mismo comando, pero sin checkout
# remoto del linter).

on:
  workflow_dispatch:

concurrency:
  group: module-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Lint contrato de módulo
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout didacta-community
        uses: actions/checkout@v4
        with:
          path: didacta-community

      # didacta-skills se checkoutea como sibling para que el wrapper script
      # de didacta-community/scripts/audit-modules.mjs lo encuentre.
      - name: Checkout didacta-skills
        uses: actions/checkout@v4
        with:
          repository: va360labs/didacta-skills
          path: didacta-skills
          # Si el repo es privado, requiere PAT con scope `repo` configurado
          # como secret. Si es público, basta GITHUB_TOKEN.
          token: ${{ secrets.DIDACTA_SKILLS_PAT || github.token }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: didacta-community/.nvmrc

      - name: Audit module contract
        working-directory: didacta-community
        run: node scripts/audit-modules.mjs --json
