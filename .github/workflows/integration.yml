name: Integration Tests

# Suite de tests de integración que requieren contenedores reales
# (Postgres, Redis). Hoy: License SDK end-to-end con Postgres real (MIG-034).
#
# Política activa desde 2026-05-01: NO ejecutar tests en GitHub Actions.
# Se corren en local sobre Docker Desktop vía `scripts/test-local.sh`
# (ver docs/TESTING-LOCAL.md). Este workflow queda como `workflow_dispatch`
# para poder lanzarlo manualmente si en algún momento se quiere validar
# en runner Linux real, pero no es la vía principal.

on:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  license-guard-integration:
    name: License Guard · Integración con Postgres real
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @didacta/database db:generate

      - name: Run integration suite (LicenseGuard + Postgres real)
        # El orquestador arranca docker-compose.test.yml, espera Postgres ready,
        # corre vitest contra él y baja el compose. En GitHub-hosted Linux runners
        # Docker está pre-instalado y disponible sin sudo.
        run: pnpm --filter @didacta/api test:integration:license

      - name: Upload logs si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ github.run_id }}
          path: |
            apps/api/coverage
            /tmp/docker-logs.txt
          if-no-files-found: ignore
          retention-days: 7
