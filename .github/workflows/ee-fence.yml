name: ee-fence

on:
  pull_request:
    paths:
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.ee/**'
      - '**/ee/**'
      - 'scripts/ee-fence.ts'
  push:
    branches: [main]

jobs:
  ee-fence:
    name: Validate open-core .ee convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ee-fence
        run: pnpm tsx scripts/ee-fence.ts
