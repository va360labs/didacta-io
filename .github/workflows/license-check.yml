name: license-check

on:
  pull_request:
    paths:
      - '**/package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/license-check.ts'
  push:
    # `develop` también, y no es un detalle: las releases se cortan de develop,
    # así que con solo `main` este check no miraba NUNCA el código que acaba en
    # una imagen publicada. Es la misma corrección que ci.yml recibió en
    # alpha.108 y que a este workflow no se le aplicó.
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * 1' # weekly Monday 06:00 UTC

permissions:
  contents: read

jobs:
  license-check:
    name: Audit dependency licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.21.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # El inventario se escribe fuera del árbol versionado: el repo no
      # versiona documentación (ver .gitignore → .fueradegit/). Sigue
      # publicándose como artifact de CI, que es donde se consulta.
      - name: Run license-check
        run: pnpm tsx scripts/license-check.ts --output "${RUNNER_TEMP}/third-party-licenses.md"

      - name: Upload license inventory artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-licenses
          path: ${{ runner.temp }}/third-party-licenses.md
