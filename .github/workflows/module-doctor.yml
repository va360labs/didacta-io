name: module-doctor

# Reactivado en push/PR (2026-08-03): la deuda que lo mantenía en
# workflow_dispatch-only quedó saldada — module-doctor a 0 errores desde
# alpha.93 (rename mod_zoom_live_ incluido) y contratos module.json ↔
# src/manifest.ts alineados. El doctor ahora también compara ambos ficheros.

on:
  push:
    # `develop` también, y no es un detalle: las releases se cortan de develop,
    # así que con solo `main` este check no miraba NUNCA el código que acaba en
    # una imagen publicada. Es la misma corrección que ci.yml recibió en
    # alpha.108 y que a este workflow no se le aplicó.
    branches: [main, develop]
    paths:
      - 'modules/**'
      - 'scripts/module-doctor.ts'
      - '.github/workflows/module-doctor.yml'
  pull_request:
    paths:
      - 'modules/**'
      - 'scripts/module-doctor.ts'
      - '.github/workflows/module-doctor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-doctor:
    name: Validate module contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.21.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run module-doctor
        run: pnpm tsx scripts/module-doctor.ts
