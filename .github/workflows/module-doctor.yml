name: module-doctor

on:
  pull_request:
    paths:
      - "modules/**"
      - "packages/core-kernel/**"
      - "scripts/module-doctor.ts"
  push:
    branches: [main]

jobs:
  module-doctor:
    name: Validate module contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run module-doctor
        run: pnpm tsx scripts/module-doctor.ts
