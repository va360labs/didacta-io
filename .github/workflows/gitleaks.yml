name: gitleaks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"  # weekly Monday 04:00 UTC

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    name: Scan secrets in repo + history
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (con historia completa para escanear todo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'
