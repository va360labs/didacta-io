name: dev-image-build

# Construye didactaio/community-dev:latest y la sube a Docker Hub.
# Solo hace falta correrlo cuando cambian deps o packages (no en cada commit).
# El hot-deploy diario usa dev-hot-deploy.yml (SSH + git pull, ~20s).

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: didactaio/community-dev

jobs:
  build:
    name: Build Dockerfile.dev → Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push community-dev:latest
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
