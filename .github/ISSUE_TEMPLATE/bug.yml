name: 🐛 Bug report
description: Algo no funciona como debería en Didacta.
title: '[BUG] '
labels: ['bug', 'alpha-tester']
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar. Cuanto más concreto, mejor podemos arreglarlo.
  - type: input
    id: version
    attributes:
      label: Versión Didacta
      description: ¿Qué tag de imagen usas? Ej. `0.0.1-alpha.0`. Mira en `.env` (`DIDACTA_IMAGE_TAG`) o en la UI.
      placeholder: '0.0.1-alpha.0'
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Cómo lo estás corriendo
      options:
        - docker compose -f docker-compose.alpha.yml
        - pnpm dev (desarrollo local)
        - Otro (especificar abajo)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Sistema operativo
      placeholder: 'macOS 14, Ubuntu 22.04, Windows 11 Pro...'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: |
        1. Ir a /admin/courses/new
        2. Rellenar título, descripción
        3. Click "Crear"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
      placeholder: 'El curso se crea y aparece en el listado.'
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento real
      placeholder: 'Devuelve error 500 con mensaje "Cannot read properties of undefined".'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs relevantes (`docker compose logs didacta`)
      description: Pega logs si los tienes. Anonimiza emails / nombres reales antes.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (opcional)
      description: Arrastra aquí imágenes si las tienes.
  - type: checkboxes
    id: confirm
    attributes:
      label: Antes de enviar
      options:
        - label: He buscado en issues abiertas y no encuentro este bug.
          required: true
        - label: He anonimizado emails / nombres reales en logs y capturas.
          required: true
